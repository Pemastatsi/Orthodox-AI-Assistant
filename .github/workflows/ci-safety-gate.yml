# CI Safety Gate
#
# Job status expectations:
#   contracts                  — green on every PR (schemas + safety YAML + OpenAPI lint).
#   safety-suite-fixtures      — green on every PR (validates the 20-case fixture shape).
#   backend                    — runs on every PR (ruff + mypy + pytest); T-001 has landed.
#   frontend                   — runs on every PR (eslint + tsc + vitest); T-001 has landed.
#   safety-suite-execution     — runs the 20 cases end-to-end now that T-006 shipped
#                                backend/tests/safety/test_20_queries_harness.py.
#                                See the in-job rationale on the safety-suite-execution job.
#
# safety-suite-execution MUST stay a required check on main. Do not "fix" a red
# result by deleting the gate; the gate is the contract.

name: CI Safety Gate

on:
  # Manual trigger for the cost-controlled paraphrase-live-llm job (see below).
  # Must exist on the default branch for the "Run workflow" button to appear.
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (schemas + openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON Schemas
        run: |
          python -c "
          import json, glob, sys
          ok = True
          for p in sorted(glob.glob('docs/schemas/*.schema.json')):
              try:
                  s = json.load(open(p))
                  assert '\$id' in s and 'title' in s, p
              except Exception as e:
                  print(f'FAIL {p}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Validate safety config YAML
        run: |
          pip install pyyaml
          python -c "
          import yaml, re
          for path in ['config/sensitivity_keywords.yaml','config/pastoral_filters.yaml']:
              data = yaml.safe_load(open(path))
              for r in data['rules']:
                  re.compile(r['pattern'])
          print('safety config OK')
          "

      - name: Lint OpenAPI
        # Redocly is pinned to an exact patch version for reproducibility.
        # Bumping requires a contract-pack PR. We `bundle` first so any
        # broken relative $ref (e.g., docs/schemas/*.schema.json) fails
        # this step rather than silently passing lint with unresolved
        # references. Per audit finding F-26.
        run: |
          npm install -g @redocly/cli@1.34.3
          redocly bundle docs/api/openapi.yaml --output /tmp/openapi.bundled.yaml
          redocly lint docs/api/openapi.yaml

  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres service so the DB-gated integration tests (RLS isolation, route
    # certify/attach, audit, billing, retention, repos) actually RUN here instead of
    # skipping. Mirrors infrastructure/docker-compose.yml (postgres:16, orthodox/orthodox/
    # orthodox), which is exactly the app's default DATABASE_URL — so no env override is
    # needed. REQUIRE_DB=1 (below) turns a missing/unreachable DB into a hard failure so the
    # suite can never silently regress to "all integration tests skipped".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orthodox
          POSTGRES_PASSWORD: orthodox
          POSTGRES_DB: orthodox
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      # Build the schema + the app_runtime/app_admin roles (migrations 0002 + 0005) the RLS
      # isolation suite's `SET ROLE app_runtime` depends on. Mirrors `make migrate`.
      - name: Run migrations
        run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    name: Frontend (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # `--` forwards --run to vitest; pnpm 9 otherwise consumes it as a pnpm flag.
      - run: pnpm test -- --run

  safety-suite-fixtures:
    name: Theological Safety Suite — Fixture Validation (20 cases present, well-shaped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Validate canonical 20-case fixture structure
        # Lightweight job (pytest only): runs just the canonical fixture-shape
        # test. The paraphrase execution tests need the full backend and run in
        # the safety-suite-execution job instead.
        run: pytest tests/safety/test_20_queries.py -v

  safety-suite-execution:
    name: Theological Safety Suite — Execution (20 cases through live pipeline)
    runs-on: ubuntu-latest
    # This job MUST be a required check on main. It is intentionally failing
    # until T-006 ships backend/tests/safety/test_20_queries_harness.py per
    # docs/contracts/scaffold-contract.md. A green check here means the 20
    # cases were actually executed end-to-end and matched expected_handling
    # AND expected_sensitivity. A green check on safety-suite-fixtures alone
    # only means the fixture file is well-shaped; that is NOT a safety gate.
    steps:
      - uses: actions/checkout@v4
      - name: Verify harness exists
        id: harness
        run: |
          if [ -f backend/tests/safety/test_20_queries_harness.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Block until harness lands (T-006)
        if: steps.harness.outputs.present == 'false'
        run: |
          echo "::error::Safety execution harness backend/tests/safety/test_20_queries_harness.py is missing."
          echo "::error::This check is intentionally failing until T-006 lands. See docs/contracts/scaffold-contract.md and audit finding F-006."
          exit 1
      - uses: actions/setup-python@v5
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install backend deps
        if: steps.harness.outputs.present == 'true'
        working-directory: backend
        run: |
          pip install uv
          uv sync
      - name: Run safety suite execution harness
        if: steps.harness.outputs.present == 'true'
        working-directory: backend
        run: uv run pytest tests/safety/test_20_queries_harness.py ../tests/safety/test_20_queries_paraphrases.py -v -m "not live_llm"

  paraphrase-live-llm:
    name: Paraphrase suite (live A1 classifier via OpenRouter)
    # Cost-controlled: manual workflow_dispatch ONLY (founder-triggered). Deliberately
    # NOT run on per-PR or push-to-main events — each run makes ~88-91 paid Haiku-4.5
    # calls via OpenRouter. The regex-layer paraphrase invariants still run on every PR
    # via safety-suite-execution above (`-m "not live_llm"`); this job is the on-demand
    # semantic / non-hard-trigger gate.
    if: github.event_name == 'workflow_dispatch'
    needs: safety-suite-execution
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Require OPENROUTER_API_KEY secret
        # Fail loudly on a missing/empty secret. Without this guard the live test
        # would skip (pytest exits 0) and this job would pass GREEN without actually
        # verifying anything. The secret value is never printed.
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is empty. Add it as a repository (or org) Actions secret named exactly OPENROUTER_API_KEY, then re-run this workflow."
            exit 1
          fi
          echo "OPENROUTER_API_KEY is present (value not printed)."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install uv
          uv sync
      - name: Run live A1 paraphrase suite
        working-directory: backend
        run: uv run pytest -m live_llm -v ../tests/safety/test_20_queries_paraphrases.py

  retrieval-eval-regression:
    name: Retrieval-Eval Regression (deterministic metrics; offline, no API cost)
    # The empirical retrieval-quality gate for purpose IN ('embedding','rerank') route
    # certification (docs/contracts/retrieval-eval-suite.md) — the counterpart to the safety suite.
    # Runs the DETERMINISTIC metrics offline (Recall@K / Precision@K / MRR / nDCG@K): zero API cost,
    # no DB. The paid Ragas-style LLM-judge metrics stay gated behind RETRIEVAL_EVAL_RUN_JUDGE + a
    # certified retrieval_eval_judge route and never run here — so no path filter is needed (the
    # contract's path filter exists only to avoid judge cost, which is moot while the judge is off).
    # Should be a required check on main alongside safety-suite-execution.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          pip install uv
          uv sync
      - name: Run retrieval-eval suite (deterministic metrics; judge path gated off)
        run: uv run pytest tests/retrieval_eval -v
