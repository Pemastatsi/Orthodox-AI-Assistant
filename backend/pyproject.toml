[project]
name = "orthodox-ai-backend"
version = "0.0.1"
description = "Orthodox AI Assistant — closed-corpus theological Q&A backend (FastAPI)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "qdrant-client>=1.10,<2",
    "redis>=5.0,<6",
    "arq>=0.26,<1",
    "anthropic>=0.39,<1",
    "openai>=1.40,<2",
    "stripe>=10.0,<13",
    "structlog>=24.1,<26",
    "httpx>=0.27,<1",
    "tenacity>=8.3,<10",
    "ulid-py>=1.1,<2",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
