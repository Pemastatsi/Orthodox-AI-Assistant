[mypy]
python_version = 3.12
plugins = pydantic.mypy

[mypy-app.domain.*]
strict = True

# REC-009: generated Pydantic models are additive scaffolding (not imported by the app) and are
# guarded by the codegen-check drift gate, not by mypy. Suppress type errors in that package.
[mypy-app.domain.models._generated]
ignore_errors = True

[mypy-app.domain.models._generated.*]
ignore_errors = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True

[mypy-pytesseract.*]
ignore_missing_imports = True

[mypy-nltk.*]
ignore_missing_imports = True
