# Railway service manifest. Two app services + Qdrant as a custom-Docker service.
# Postgres and Redis are Railway-managed plugins, attached separately in the dashboard.

[[services]]
name = "backend"

[services.build]
dockerfilePath = "infrastructure/Dockerfile.backend"

[services.deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

# Retention worker: reuses the backend image, overrides the start command to run the arq scheduler
# instead of uvicorn. No healthcheck (not an HTTP service). Attach the same env as `backend` in the
# dashboard: DATABASE_ADMIN_URL (falls back to DATABASE_URL), REDIS_URL, and optionally
# RETENTION_WORKER_CRON. See docs/runbooks/retention-worker.md.
[[services]]
name = "retention-worker"

[services.build]
dockerfilePath = "infrastructure/Dockerfile.backend"

[services.deploy]
startCommand = "arq app.workers.retention_worker.WorkerSettings"
restartPolicyType = "ON_FAILURE"

[[services]]
name = "web"

[services.build]
dockerfilePath = "infrastructure/Dockerfile.web"

[services.deploy]
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"

[[services]]
name = "qdrant"

[services.build]
image = "qdrant/qdrant:latest"

[services.deploy]
restartPolicyType = "ON_FAILURE"
